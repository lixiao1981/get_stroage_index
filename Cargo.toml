[package]
name = "get_stroage_index"
version = "0.1.0"
edition = "2021"

[dependencies]
# MDBX database bindings - using heed for better ergonomics
heed = { version = "0.20", features = ["read-txn-no-tls"] }

# RLP encoding/decoding
alloy-rlp = "0.3"

# Ethereum types (addresses, hashes, U256)
alloy-primitives = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
bytes = "1.5"

[dev-dependencies]
tempfile = "3.8"
hex-literal = "0.4"
hex = "0.4"
criterion = "0.5"

[[bench]]
name = "account_queries"
harness = false
